version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudprune-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - cloudprune-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudprune-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cloudprune-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: cloudprune-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    restart: unless-stopped
    networks:
      - cloudprune-net

networks:
  cloudprune-net:
    driver: bridge
